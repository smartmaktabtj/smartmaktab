#:schema https://supabase.com/schemas/config/v1.json
project_id = "smartmaktab-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Auth users are provisioned first; run dev_fixture.sql only after that.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:4173/dev/"
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = true

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false
