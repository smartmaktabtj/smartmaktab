name: SmartMaktab — Windows для распространения (без подписи)
on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Версия Windows (X.Y.Z)'
        type: string
        default: '1.0.0'
        required: true
      confirm_unsigned:
        description: 'Подтвердите выпуск без подписи: напишите PUBLISH-UNSIGNED'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: unsigned-windows-distribution
  cancel-in-progress: false
jobs:
  windows_unsigned:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SM_RELEASE_VERSION: ${{ inputs.windows_version }}
      SM_CONFIRM_PUBLIC_UNSIGNED: ${{ inputs.confirm_unsigned }}
      SM_CONTENT_PUBLIC_KEY: ${{ vars.SM_CONTENT_PUBLIC_KEY }}
      SM_CONTENT_FEED: ${{ vars.SM_CONTENT_FEED }}
      MAY_PUBLISH: ${{ !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Check unsigned distribution inputs
        shell: pwsh
        run: |
          if ($env:MAY_PUBLISH -cne 'true') { throw 'Use the default branch of the public repository that hosts the Android downloads' }
          if ($env:SM_CONFIRM_PUBLIC_UNSIGNED -cne 'PUBLISH-UNSIGNED') { throw 'Type PUBLISH-UNSIGNED to confirm an unsigned build for distribution' }
          if ($env:SM_RELEASE_VERSION -cnotmatch '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$') { throw 'Version must be X.Y.Z' }
          if ([string]::IsNullOrWhiteSpace($env:SM_CONTENT_PUBLIC_KEY)) { throw 'Add repository variable SM_CONTENT_PUBLIC_KEY before building for USB updates' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and package Windows x64
        shell: pwsh
        run: |
          node scripts/windows-content.cjs configure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_startup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage-native-web.py native/windows/web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix native/windows ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location native/windows
          npx --no-install electron-builder --config unsigned-builder.cjs --win nsis --x64 --ia32 --publish never
          exit $LASTEXITCODE
      - name: Verify unsigned installers and record hashes
        shell: pwsh
        run: |
          $out = 'native/windows/unsigned-release'
          $expectedNames = @(
            "SmartMaktab-${env:SM_RELEASE_VERSION}-Windows-x64-UNSIGNED.exe",
            "SmartMaktab-${env:SM_RELEASE_VERSION}-Windows-ia32-UNSIGNED.exe"
          )
          $lines = @()
          foreach ($expected in $expectedNames) {
            $file = Get-Item (Join-Path $out $expected) -ErrorAction SilentlyContinue
            if ($null -eq $file) { throw "Missing installer $expected" }
            if ($file.Length -lt 1 -or $file.Length -gt 400MB) { throw "Installer exceeds the Android download size limit: $expected" }
            if ((Get-AuthenticodeSignature -FilePath $file.FullName).Status -ne 'NotSigned') { throw "Unexpected installer signature status: $expected" }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $expected"
          }
          $lines | Set-Content "$out/SHA256SUMS.txt" -Encoding utf8NoBOM
      - name: Build universal setup (auto 32/64-bit)
        shell: pwsh
        run: |
          $out = 'native/windows/unsigned-release'
          $uni = Join-Path $PWD 'universal-setup'
          New-Item -ItemType Directory -Force -Path $uni | Out-Null
          Copy-Item (Join-Path $out "SmartMaktab-${env:SM_RELEASE_VERSION}-Windows-x64-UNSIGNED.exe") (Join-Path $uni 'x64.exe')
          Copy-Item (Join-Path $out "SmartMaktab-${env:SM_RELEASE_VERSION}-Windows-ia32-UNSIGNED.exe") (Join-Path $uni 'ia32.exe')
          $setupName = "SmartMaktab-${env:SM_RELEASE_VERSION}-Windows-Setup-UNSIGNED.exe"
          $setupPath = Join-Path $out $setupName
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $cached = Get-ChildItem "$env:LOCALAPPDATA\electron-builder\Cache" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cached) { $makensis = $cached.FullName }
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS is required for the universal setup' }
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $makensis) { throw 'makensis not found' }
          $nsiScript = Join-Path $PWD 'native/windows/universal-installer.nsi'
          & $makensis "/DX64_EXE=$(Join-Path $uni 'x64.exe')" "/DIA32_EXE=$(Join-Path $uni 'ia32.exe')" "/DOUT_FILE=$setupPath" $nsiScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item $setupPath
          if ($setup.Length -lt 1 -or $setup.Length -gt 400MB) { throw 'Universal setup exceeds the Android download size limit' }
          if ((Get-AuthenticodeSignature -FilePath $setup.FullName).Status -ne 'NotSigned') { throw 'Unexpected universal setup signature status' }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content "$out/SHA256SUMS.txt" "$hash  $setupName" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMaktab-Windows-UNSIGNED-${{ inputs.windows_version }}
          path: |
            native/windows/unsigned-release/*-Windows-Setup-UNSIGNED.exe
            native/windows/unsigned-release/*-Windows-x64-UNSIGNED.exe
            native/windows/unsigned-release/*-Windows-ia32-UNSIGNED.exe
            native/windows/unsigned-release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
  publish_windows:
    needs: windows_unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SmartMaktab-Windows-UNSIGNED-${{ inputs.windows_version }}
          path: release-files
      - name: Publish a versioned Windows release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.windows_version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]
          tag="windows-unsigned-v$VERSION"
          setup="SmartMaktab-$VERSION-Windows-Setup-UNSIGNED.exe"
          exe64="SmartMaktab-$VERSION-Windows-x64-UNSIGNED.exe"
          exe32="SmartMaktab-$VERSION-Windows-ia32-UNSIGNED.exe"
          test -s "$setup"
          test -s "$exe64"
          test -s "$exe32"
          grep -F "  $setup" SHA256SUMS.txt >/dev/null
          grep -F "  $exe64" SHA256SUMS.txt >/dev/null
          grep -F "  $exe32" SHA256SUMS.txt >/dev/null
          test "$(sha256sum -- "$setup" | cut -d' ' -f1)" = "$(grep -F "  $setup" SHA256SUMS.txt | cut -d' ' -f1)"
          test "$(sha256sum -- "$exe64" | cut -d' ' -f1)" = "$(grep -F "  $exe64" SHA256SUMS.txt | cut -d' ' -f1)"
          test "$(sha256sum -- "$exe32" | cut -d' ' -f1)" = "$(grep -F "  $exe32" SHA256SUMS.txt | cut -d' ' -f1)"
          gh release create "$tag" "$setup" "$exe64" "$exe32" SHA256SUMS.txt \
            --target "$COMMIT" --title "SmartMaktab Windows $VERSION — без подписи (универсальный установщик)" \
            --latest=false \
            --notes 'Главный файл: SmartMaktab-*-Windows-Setup-UNSIGNED.exe — универсальный установщик Windows 7/8.1/10/11. При установке сам определяет 32- или 64-битную Windows и ставит нужную версию. Отдельные x64 и ia32 тоже в релизе. Установщики не подписаны Authenticode. SmartScreen или политики организации могут заблокировать установку. Windows 7: нужен SP1 и обновления SHA-2 (KB3033920). Контрольные суммы SHA-256 в SHA256SUMS.txt. Для обновления материалов используйте подписанные пакеты .smupdate.' 
