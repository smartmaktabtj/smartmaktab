name: SmartMaktab — нашри имзодор (Android APK/AAB)
on:
  workflow_dispatch:
    inputs:
      format:
        description: 'Чӣ сохта шавад (APK ё AAB)'
        type: choice
        options: [APK, AAB]
        required: true
        default: APK
      release_version:
        description: 'Версияи нашр X.Y.Z'
        type: string
        default: '1.0.0'
        required: true
      android_version_code:
        description: 'Android versionCode (барои Google Play зиёд кунед)'
        type: string
        default: '1'
        required: true
permissions:
  contents: read
concurrency:
  group: signed-release-${{ inputs.format }}
  cancel-in-progress: false
env:
  SM_RELEASE_VERSION: ${{ inputs.release_version }}
  SM_ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
jobs:
  android:
    if: inputs.format == 'APK' || inputs.format == 'AAB'
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      SM_FORMAT: ${{ inputs.format }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check signing inputs before building
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py preflight
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          gradle-home-cache-includes: |
            caches/modules-2
      - name: Install Android SDK and command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare Android release assets
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          python3 scripts/stage-native-web.py native/android/app/src/main/assets
      - name: Build and verify selected signed package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android-release.py build
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMaktab-${{ inputs.release_version }}-${{ inputs.format }}-signed
          path: native/android/release/
          if-no-files-found: error
          retention-days: 14
