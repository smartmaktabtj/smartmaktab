name: SmartMaktab — проверка кода, браузера и Android Java
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: |
          for f in shared/*.mjs cabinets/school/*.mjs admin/*.mjs startup/wizard.js native/windows/main.cjs admin-desktop/*.cjs admin-desktop/*.mjs; do
            node --check "$f"
          done
      - run: npm test
      - run: python3 scripts/build_startup.py

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: |
          python3 scripts/preview.py --port 4180 > /tmp/preview.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ >/dev/null; then break; fi
            sleep 1
          done
          run_bt() {
            local name="$1"
            local out
            if ! out=$(npm run "$name" 2>&1); then
              echo "$out"
              local snippet
              snippet=$(printf '%s\n' "$out" | tail -n 35 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error title=Failed browser suite: $name::$snippet"
              return 1
            fi
            echo "$out"
          }
          run_bt test:startup:browser
          run_bt test:cabinets:browser
          run_bt test:director:browser
          run_bt test:school-forms:browser
          run_bt test:update-operations:browser
          run_bt test:file-viewer:browser
          run_bt test:brand-splash:browser
          run_bt test:role-profiles:browser
          run_bt test:library:browser
          run_bt test:kitobkhona-reader:browser
          run_bt test:portable:browser
          run_bt test:phase2:browser
          run_bt test:verification:browser

  android-java-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - run: |
          npm ci --no-audit --no-fund
          python3 scripts/build_startup.py
          python3 scripts/stage-native-web.py native/android/app/src/main/assets/web
      - name: Compile Android Java sources (compile-only verification)
        run: |
          keytool -genkeypair -v -storetype JKS -keystore /tmp/ci-verify.jks \
            -storepass ci-verify-pass -keypass ci-verify-pass -alias ci-key \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI Verify,O=SmartMaktab"
          SM_ANDROID_STORE_FILE=/tmp/ci-verify.jks \
          ANDROID_KEYSTORE_PASSWORD=ci-verify-pass \
          ANDROID_KEY_ALIAS=ci-key \
          ANDROID_KEY_PASSWORD=ci-verify-pass \
          SM_RELEASE_VERSION=1.0.0 \
          SM_ANDROID_VERSION_CODE=1 \
          gradle --no-daemon :app:compileReleaseJavaWithJavac
        working-directory: native/android
