pluginManagement {
    repositories {
        google()
        // Google-hosted Maven Central mirror. Use a single Central source in CI;
        // the Gradle plugin portal redirects library requests to the same primary host.
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
    }
}
rootProject.name = 'SmartMaktab'
include ':app'
