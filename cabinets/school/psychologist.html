.sm-chart-card{background:var(--tint);border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sm-chart-wide{flex-direction:column;align-items:stretch}
.sm-chart-title{font-weight:700;font-size:.92rem;color:var(--ink)}
.sm-chart-legend{display:grid;gap:6px;font-size:.86rem}
.sm-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
@keyframes sm-stroke-draw{from{stroke-dashoffset:var(--full-len,340)}to{stroke-dashoffset:var(--target-offset,0)}}
@keyframes sm-bar-rise{from{transform:scaleY(.08);opacity:.3}to{transform:scaleY(1);opacity:1}}
@keyframes sm-width-grow{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
.sm-anim-stroke{animation:sm-stroke-draw .85s cubic-bezier(.2,.8,.2,1) both}
.sm-anim-delay{animation-delay:140ms}
.sm-anim-bar{transform-box:fill-box;transform-origin:bottom center;animation:sm-bar-rise .7s cubic-bezier(.2,.8,.2,1) both}
.sm-hbars{display:grid;gap:9px;margin-top:6px}
.sm-hbar-row{display:grid;gap:4px}
.sm-hbar-head{display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
.sm-hbar-track{height:10px;border-radius:999px;background:rgba(17,99,71,.12);overflow:hidden}
.sm-hbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#116347,#c89d39);transform-origin:left center;animation:sm-width-grow .75s cubic-bezier(.2,.8,.2,1) both}
.sm-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(36px,1fr));gap:5px;margin:10px 0;max-width:460px}
.sm-cal-head{font-size:.74rem;font-weight:700;text-align:center;color:var(--muted);padding:3px 0}
.sm-cal-day{border:1px solid var(--line);border-radius:8px;padding:6px 4px;background:var(--tint);color:var(--ink);font-size:.8rem;font-weight:650;cursor:pointer;text-align:center}
.sm-cal-day.is-weekend{background:#eff2f0;color:var(--muted);opacity:.72}
.sm-cal-day.is-holiday{background:#fff1d4;border-color:#d89c2e;color:#6f4506;text-decoration:line-through}
.sm-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700}
.sm-badge-pending{background:#fff1d4;color:#704a0d}
.sm-badge-approved{background:#dcf4e5;color:#115e3b}
.sm-badge-changes{background:#fde7d8;color:#8b3a0e}
.sm-badge-rejected{background:#fbdcdc;color:#8e1e1e}
.sm-badge-not_sent{background:#eff2f0;color:#4b6357}
[data-theme="dark"] .sm-cal-day.is-weekend{background:#182721;color:#8fa89b}
[data-theme="dark"] .sm-cal-day.is-holiday{background:#4c3818;border-color:#c89d39;color:#ffe2a6}
[data-theme="dark"] .sm-badge-pending{background:#4b3a1c;color:#ffe09c}
[data-theme="dark"] .sm-badge-approved{background:#1d4432;color:#a5f0c5}
[data-theme="dark"] .sm-badge-changes{background:#4d2d1d;color:#ffd0b0}
[data-theme="dark"] .sm-badge-rejected{background:#4b2020;color:#ffb4b4}
[data-theme="dark"] .sm-badge-not_sent{background:#243830;color:#aac3b5}
.sm-inline-input{width:78px;padding:4px 6px;border:1px solid #bcd3c5;border-radius:7px;background:inherit;color:inherit;font:inherit;font-size:.85rem}
.sm-p2-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}

.aliya-phone-head{height:calc(58px + env(safe-area-inset-top,0px))}.aliya-book-context progress{appearance:none;-webkit-appearance:none;background:var(--reader-line);overflow:hidden}.aliya-book-context progress::-webkit-progress-bar{background:var(--reader-line);border-radius:4px}.aliya-book-context progress::-webkit-progress-value{background:var(--reader-gold);border-radius:4px}.aliya-book-context progress::-moz-progress-bar{background:var(--reader-gold)}.aliya-phone-inner .aliya-result{margin-inline:0}.aliya-empty .aliya-mark{width:17px;flex-basis:17px;height:17px}.aliya-empty .aliya-mark svg{width:15px;height:15px}

/* Menu dropdown positioning */
.sm-native-files{position:relative}
.sm-native-files>summary{cursor:pointer;list-style:none}
.sm-native-files>summary::-webkit-details-marker{display:none}
.sm-native-files[open]>div{
  position:absolute;
  inset-inline-end:0;
  inset-block-start:calc(100% + 5px);
  background:var(--paper,#fff);
  border:1px solid var(--line,#c9ded1);
  border-radius:12px;
  padding:8px;
  min-width:220px;
  width:max-content;
  max-width:calc(100vw - 20px);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:6px;
}
[data-theme="dark"] .sm-native-files[open]>div{
  background:#1b2a24;
  border-color:var(--line,#425e51);
}
.sm-native-files[open]>div button{
  width:100%;
  text-align:left;
  white-space:normal;
  word-wrap:break-word;
}
.sm-license-grace{
  margin-bottom:12px;
  border-left:4px solid #b86a14;
}
.sm-license-lock{
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(12,24,18,.94);
  color:#f4f7f5;
  display:grid;
  place-content:center;
  gap:12px;
  padding:24px;
  text-align:center;
}
.sm-license-lock h2{margin:0;color:#fff;}
.sm-license-lock p{margin:0;max-width:520px;}
.sm-license-lock .control{justify-content:center;}

/* Kitobkhona-grade PDF reader stage, WebGL curl, 3D page flip, 12 paper tints & rich Aliya styling */
.pdf-reader .pdf-stage{position:relative;display:grid;place-items:center;overflow:auto;touch-action:pan-x pan-y;user-select:none;transition:background .2s ease}
.pdf-reader .pdf-stage.zoomed{cursor:grab;touch-action:none}
.pdf-reader .pdf-stage.zoomed:active{cursor:grabbing}
.pdf-stage-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;will-change:transform;perspective:1400px}
.pdf-stage-wrap>canvas{display:block;box-shadow:0 8px 28px rgba(0,0,0,.22);border-radius:2px}
.reader-paper-tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;border-radius:2px;z-index:2}
.pdf-stage-wrap.curl-active>canvas{visibility:hidden}
.reader-curl-layer{position:absolute;inset:0;z-index:4;pointer-events:none}
.reader-curl-base,.reader-curl-surface{position:absolute;inset:0;width:100%;height:100%;display:block}
.flip-shade{position:absolute;z-index:3;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.04) 45%,transparent);pointer-events:none}
.flip-flap{position:absolute;z-index:4;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.35);backface-visibility:hidden;overflow:hidden;border-radius:2px}
.flip-flap canvas{display:block;width:100%;height:100%}

.reader-bars-hidden .reader-top,.reader-bars-hidden .reader-bottom{opacity:0;pointer-events:none;transition:opacity .25s ease}
.reader-top,.reader-bottom{transition:opacity .2s ease}

.reader-dial{font-size:12px;padding:4px 8px;min-width:0}
.paper-color-dot{width:24px!important;height:24px!important;min-width:24px!important;min-height:24px!important;padding:0!important;border-radius:999px!important;border:2px solid var(--reader-gold,#e8c96d)!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
@media(max-width:800px){.pdf-reader .reader-bottom{gap:3px;padding:5px 6px max(5px,env(safe-area-inset-bottom))}.pdf-reader .reader-bottom .reader-button{min-height:27px;padding:3px 6px;font-size:.7rem}}
.reader-paper-title{display:block;margin:10px 0 6px;font-size:12.5px;font-weight:600;color:var(--reader-ink)}
.reader-paper-grid{display:grid;grid-template-columns:repeat(6,28px);gap:7px;margin-bottom:6px}
.reader-paper-swatch{width:28px;height:28px;border-radius:999px;border:2px solid rgba(128,128,128,.35);cursor:pointer;padding:0;transition:transform .12s ease,border-color .12s ease}
.reader-paper-swatch[aria-pressed="true"]{border-color:var(--reader-gold,#e8c96d);transform:scale(1.12);box-shadow:0 0 0 2px rgba(232,201,109,.35)}

.aliya-cloud-bar{padding:10px 12px;margin:0 2px 14px;border:1px solid var(--reader-line);border-radius:12px;background:var(--ra-card);align-items:center}
.aliya-ask-form{display:flex;gap:7px;margin:0 2px 12px}
.aliya-ask-form input{flex:1;min-width:0;padding:8px 11px;border-radius:11px;border:1px solid var(--reader-line);background:var(--ra-card);color:var(--reader-ink);font:inherit;font-size:13px}
.aliya-ask-form .aliya-ask-send{flex:none;border-radius:11px;padding:8px 13px;background:var(--reader-gold);color:#101c2b;font-weight:700}
.aliya-range-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.aliya-range-chips .reader-button{padding:4px 10px;font-size:12px;border-radius:999px}
.aliya-topic-badge{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:999px;background:rgba(232,201,109,.15);border:1px solid rgba(232,201,109,.35);color:var(--reader-gold);font-size:12px;font-weight:650}
.aliya-nm{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;color:var(--reader-gold)}
.aliya-result-card h4,.aliya-result-card h5{margin:10px 0 5px;color:var(--reader-gold);font-size:14px}
.aliya-q{margin:10px 0 4px;font-weight:650;color:#fff}
.aliya-opt{padding:3px 8px;border-radius:7px;margin:2px 0;font-size:13px;background:rgba(255,255,255,.04)}
.aliya-opt-ok{background:rgba(46,160,67,.18);border:1px solid rgba(63,185,80,.4);color:#bbf7d0}
.aliya-key{margin-top:8px;padding:7px 10px;border-radius:9px;background:rgba(232,201,109,.12);border-left:3px solid var(--reader-gold);font-size:13px}
.sm-upd-trigger{position:relative;display:inline-flex;align-items:center;gap:4px}
.sm-upd-badge{width:8px;height:8px;border-radius:50%;background:#e05246;display:inline-block;box-shadow:0 0 0 2px var(--paper,#fff)}
.aliya-tbl-wrap{overflow-x:auto;margin:8px 0}
.aliya-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.aliya-tbl th,.aliya-tbl td{border:1px solid var(--reader-line);padding:5px 8px;text-align:left}
.aliya-tbl th{background:var(--ra-card2);color:var(--reader-gold)}
.aliya-tools-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--reader-line)}
.aliya-tools-row .reader-button{font-size:12px;padding:5px 10px;border-radius:9px}
.sm-device-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:7px}
.sm-device-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:.86rem}
.sm-lock-devices{width:min(100%,520px);margin:4px auto;text-align:left}
.sm-lock-devices .sm-device-row{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.sm-lock-devices .button.alt{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.45)}
.sm-user-dev-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.sm-user-dev-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--tint);font-size:.76rem}
.sm-user-dev-chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 2px;font-weight:700;opacity:.75}
.sm-user-dev-chip button:hover{opacity:1;color:#a61d24}
.sm-issued-box{padding:12px 14px;border-radius:12px;border:1px solid #35895e;background:#e6f6ec;color:#143624;margin:10px 0;display:grid;gap:6px}
[data-theme="dark"] .sm-issued-box{background:#1b3828;border-color:#4b9a6f;color:#d6f5e3}
.sm-badge-verified,.sm-badge-active{background:#dcf4e5;color:#115e3b}
.sm-badge-unverified,.sm-badge-disabled{background:#fde7d8;color:#8b3a0e}
