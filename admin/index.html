<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartMaktab Admin</title>
  <link rel="icon" type="image/png" href="../shared/brand-icon.png">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="adm-head">
    <div class="adm-brand">
      <img src="../shared/brand-icon.png" alt="" class="adm-brand-icon" width="36" height="36">
      <div>
        <h1 data-t="title">SmartMaktab Admin</h1>
        <p data-t="sub"></p>
      </div>
    </div>
    <div class="adm-row" style="margin-top:0">
      <button id="reloadBtn" type="button" class="btn alt" data-t="reload" hidden></button>
      <button id="signOutBtn" type="button" class="btn alt" data-t="signOut" hidden></button>
    </div>
  </header>

  <main class="adm-main">
    <p id="admStatus" class="adm-status" role="status" hidden></p>

    <section id="admLoginCard" class="adm-card">
      <h2 data-t="loginTitle"></h2>
      <p class="adm-meta"><strong data-t="projectInfo"></strong>: <code id="projectEndpoint"></code></p>
      <form id="admLoginForm" class="adm-grid" autocomplete="off">
        <label class="adm-field"><span data-t="email"></span><input id="loginEmail" type="email" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" required value="sinamostudio@gmail.com"></label>
        <label class="adm-field"><span data-t="password"></span><div class="adm-pass-wrap"><input id="loginPassword" type="password" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" required><button type="button" id="toggleAdmLoginPassword" class="adm-pass-eye" aria-label="Показать пароль">👁️</button></div></label>
        <p class="adm-latin-warn" id="admLoginLatinWarn" hidden>⚠️ Ба забони лотинӣ (англисӣ: a-z, 0-9) нависед — ҳуруфи кириллӣ истифода шудаанд.</p>
        <div class="adm-row" style="align-self:end">
          <button type="submit" class="btn" data-t="signIn"></button>
          <button id="sendRecoveryBtn" type="button" class="btn alt" data-t="sendRecovery"></button>
        </div>
      </form>
    </section>

    <section id="admWorkspace" hidden>
      <section id="admPasswordCard" class="adm-card" hidden>
        <h2 data-t="setPasswordTitle"></h2>
        <form id="admPasswordForm" class="adm-grid">
          <label class="adm-field"><span data-t="newPassword"></span><div class="adm-pass-wrap"><input id="newPasswordInput" type="password" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" minlength="8" required><button type="button" id="toggleAdmNewPassword" class="adm-pass-eye" aria-label="Показать пароль">👁️</button></div></label>
          <div class="adm-row" style="align-self:end"><button type="submit" class="btn" data-t="save"></button></div>
        </form>
      </section>

      <div id="admSummaryBar" class="adm-stats"></div>

      <nav class="adm-tabs" role="tablist">
        <button type="button" class="btn alt" data-tab="orgs" data-t="tabOrgs"></button>
        <button type="button" class="btn alt" data-tab="verifications" data-t="tabVerifications"></button>
        <button type="button" class="btn alt" data-tab="roles" data-t="tabRoles"></button>
        <button type="button" class="btn alt" data-tab="licenses" data-t="tabLicenses"></button>
        <button type="button" class="btn alt" data-tab="plans" data-t="tabPlans"></button>
        <button type="button" class="btn alt" data-tab="payments" data-t="tabPayments"></button>
      </nav>

      <!-- 1. ОРГАНИЗАЦИИ И ШКОЛЫ -->
      <section class="adm-card" data-pane="orgs">
        <h2 data-t="tabOrgs"></h2>
        <p class="adm-hint" data-t="orgsHint"></p>
        <div id="orgEditBanner" class="adm-edit-banner" hidden>
          <span id="orgEditLabel"></span>
          <button id="orgCancelEdit" type="button" class="btn alt sm" data-t="cancelEdit"></button>
        </div>
        <form id="orgForm" class="adm-grid">
          <label class="adm-field">
            <span data-t="orgName"></span>
            <input id="orgName" required maxlength="160">
            <small data-t="orgNameHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="orgTypeLabel"></span>
            <select id="orgTypePreset">
              <option value="school" data-t="presetSchool"></option>
              <option value="maorif" data-t="presetMaorif"></option>
              <option value="raesat" data-t="presetRaesat"></option>
            </select>
            <small data-t="orgTypeHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="region"></span>
            <input id="orgRegion" maxlength="120" list="regionDatalist">
            <datalist id="regionDatalist"></datalist>
            <small data-t="regionHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="district"></span>
            <input id="orgDistrict" maxlength="120" list="districtDatalist">
            <datalist id="districtDatalist"></datalist>
            <small data-t="districtHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="jamoat"></span>
            <input id="orgJamoat" maxlength="120" list="jamoatDatalist">
            <datalist id="jamoatDatalist"></datalist>
          </label>
          <label class="adm-field">
            <span data-t="village"></span>
            <input id="orgVillage" maxlength="120" list="villageDatalist">
            <datalist id="villageDatalist"></datalist>
          </label>
          <label class="adm-field">
            <span data-t="orgParent"></span>
            <select id="orgParent"></select>
            <small data-t="orgParentHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="schoolCode"></span>
            <div class="adm-inline">
              <input id="orgCode" maxlength="40" placeholder="SM-089">
              <button id="orgGenCode" type="button" class="btn alt sm" data-t="generateCode"></button>
            </div>
            <small data-t="schoolCodeHint"></small>
          </label>
          <div class="adm-row" style="align-self:end">
            <button type="submit" class="btn" data-t="save"></button>
          </div>
        </form>

        <div class="adm-filters">
          <label class="adm-field"><span data-t="filterRegion"></span><select id="filterRegion"></select></label>
          <label class="adm-field"><span data-t="filterDistrict"></span><select id="filterDistrict"></select></label>
          <label class="adm-field"><span data-t="filterKind"></span>
            <select id="filterKind">
              <option value="all" data-t="allKinds"></option>
              <option value="school" data-t="presetSchool"></option>
              <option value="maorif" data-t="presetMaorif"></option>
              <option value="raesat" data-t="presetRaesat"></option>
            </select>
          </label>
          <label class="adm-field"><span data-t="filterSearch"></span><input id="filterSearch" type="search" maxlength="80"></label>
        </div>
        <details id="orgHierarchyBox" class="adm-tree-box" open>
          <summary data-t="hierarchyTitle"></summary>
          <div id="orgHierarchyTree" class="adm-tree"></div>
        </details>
        <p id="orgsCountInfo" class="adm-meta"></p>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colName"></th>
                <th data-t="colKind"></th>
                <th data-t="colLocation"></th>
                <th data-t="colParent"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="orgsTbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 1Б. ВЕРИФИКАЦИЯ АККАУНТОВ И НОВЫХ ШКОЛ -->
      <section class="adm-card" data-pane="verifications" hidden>
        <h2 data-t="tabVerifications"></h2>
        <p class="adm-hint" data-t="verificationsHint"></p>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colUser"></th>
                <th data-t="colOrgPosition"></th>
                <th data-t="colIdentity"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="verificationsTbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 2. ПОЛЬЗОВАТЕЛИ, ДОЛЖНОСТИ И УСТРОЙСТВА -->
      <section class="adm-card" data-pane="roles" hidden>
        <h2 data-t="tabRoles"></h2>
        <p class="adm-hint" data-t="rolesHint"></p>
        <form id="roleForm" class="adm-grid">
          <label class="adm-field">
            <span data-t="pickUser"></span>
            <select id="roleUserPick"></select>
          </label>
          <label class="adm-field">
            <span data-t="userEmail"></span>
            <input id="roleUserId" type="text" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="sharipov, 907972295 ё email">
          </label>
          <label class="adm-field">
            <span data-t="fullName"></span>
            <input id="roleFullName" maxlength="160">
          </label>
          <label class="adm-field">
            <span data-t="roleRegionFilter"></span>
            <select id="roleRegionFilter"></select>
          </label>
          <label class="adm-field">
            <span data-t="targetOrg"></span>
            <select id="roleOrg" required></select>
            <small id="roleOrgQuotaInfo" class="adm-quota-note"></small>
          </label>
          <label class="adm-field">
            <span data-t="primaryPosition"></span>
            <select id="rolePrimaryPos" required></select>
            <small id="roleLoginAllowedHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="accessLevel"></span>
            <select id="roleName"></select>
            <small data-t="accessLevelHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="maxExtraPos"></span>
            <input id="roleMaxExtra" type="number" min="0" max="19" value="0" required>
            <small data-t="maxExtraHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="maxDevices"></span>
            <input id="roleMaxDevices" type="number" min="1" max="40" value="2" required>
            <small data-t="maxDevicesHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="tempPassword"></span>
            <div class="adm-pass-wrap"><input id="roleTempPassword" type="password" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" minlength="8" autocomplete="new-password"><button type="button" id="toggleRoleTempPassword" class="adm-pass-eye" aria-label="Показать пароль">👁️</button></div>
            <small data-t="tempPassHint"></small>
          </label>
          <p class="adm-latin-warn" id="admRoleLatinWarn" hidden>⚠️ Ба забони лотинӣ (англисӣ: a-z, 0-9) нависед — ҳуруфи кириллӣ истифода шудаанд.</p>
          <div class="adm-field" style="align-self:end;gap:8px">
            <label class="adm-check"><input id="roleResetPass" type="checkbox"><span data-t="issueTempPassword"></span></label>
            <label class="adm-check"><input id="roleAccountActive" type="checkbox" checked><span data-t="accountActive"></span></label>
            <label class="adm-check"><input id="roleAliyaEnabled" type="checkbox"><span>Алия (+30 TJS)</span></label>
          </div>
          <div class="adm-field adm-wide">
            <span data-t="extraPositionsLabel"></span>
            <div id="roleExtraPositionsBox" class="adm-checkbox-grid"></div>
          </div>
          <div class="adm-row" style="align-self:end"><button type="submit" class="btn" data-t="assignRole"></button></div>
        </form>

        <section id="issuedAccessCard" class="adm-issued" hidden>
          <strong id="issuedAccessTitle"></strong>
          <pre id="issuedAccessText"></pre>
          <div class="adm-row" style="margin-top:4px">
            <button id="copyAccessBtn" type="button" class="btn sm" data-t="copyCredentials"></button>
            <button id="closeAccessBtn" type="button" class="btn alt sm" data-t="hideCard"></button>
          </div>
        </section>

        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colUser"></th>
                <th data-t="colOrgPosition"></th>
                <th data-t="colQuotas"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="rolesTbody"></tbody>
          </table>
        </div>

        <h3 class="adm-subhead" data-t="devicesHeading"></h3>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colUser"></th>
                <th data-t="colDevice"></th>
                <th data-t="colLastSeen"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="devicesTbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 3. ЛИЦЕНЗИИ И КВОТЫ ОРГАНИЗАЦИЙ -->
      <section class="adm-card" data-pane="licenses" hidden>
        <h2 data-t="tabLicenses"></h2>
        <p class="adm-hint" data-t="licensesHint"></p>
        <form id="licForm" class="adm-grid">
          <label class="adm-field"><span data-t="licRegionFilter"></span><select id="licRegionFilter"></select></label>
          <label class="adm-field"><span data-t="targetOrg"></span><select id="licOrg" required></select></label>
          <label class="adm-field"><span data-t="licenseStatus"></span>
            <select id="licStatus">
              <option value="trial" data-t="statusTrial"></option>
              <option value="active" data-t="statusActive"></option>
              <option value="grace" data-t="statusGrace"></option>
              <option value="expired" data-t="statusExpired"></option>
              <option value="suspended" data-t="statusSuspended"></option>
            </select>
          </label>
          <label class="adm-field"><span data-t="planCode"></span><input id="licPlan" value="standard" required></label>
          <label class="adm-field"><span data-t="expiresAt"></span><input id="licExpires" type="date" required></label>
          <label class="adm-field"><span data-t="graceDays"></span><input id="licGraceDays" type="number" min="0" max="90" value="30" required></label>
          <label class="adm-field">
            <span data-t="maxAccounts"></span>
            <input id="licMaxAccounts" type="number" min="1" max="500" value="1" required>
            <small data-t="maxAccountsHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="maxPosPerAcc"></span>
            <input id="licMaxPos" type="number" min="1" max="20" value="1" required>
            <small data-t="maxPosPerAccHint"></small>
          </label>
          <label class="adm-field">
            <span data-t="defaultMaxDev"></span>
            <input id="licDefaultDev" type="number" min="1" max="40" value="2" required>
          </label>
          <label class="adm-field"><span data-t="notes"></span><input id="licNotes" maxlength="400"></label>
          <div class="adm-row" style="align-self:end"><button type="submit" class="btn" data-t="save"></button></div>
        </form>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colName"></th>
                <th data-t="colStatus"></th>
                <th data-t="colQuotas"></th>
                <th data-t="expiresAt"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="licensesTbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 4. ТАРИФЫ ДОЛЖНОСТЕЙ И РЕКВИЗИТЫ -->
      <section class="adm-card" data-pane="plans" hidden>
        <h2 data-t="tabPlans"></h2>
        <p class="adm-hint" data-t="plansHint"></p>
        <form id="planForm" class="adm-grid">
          <label class="adm-field"><span data-t="planCode"></span><input id="planCode" value="trial_10" required maxlength="40"></label>
          <label class="adm-field"><span data-t="planTitleTg"></span><input id="planTitleTg" required maxlength="160"></label>
          <label class="adm-field"><span data-t="planTitleRu"></span><input id="planTitleRu" required maxlength="160"></label>
          <label class="adm-field"><span data-t="planPrice"></span><input id="planPrice" type="number" step="0.01" min="0" value="10.00" required></label>
          <label class="adm-field"><span data-t="planDays"></span><input id="planDays" type="number" min="1" max="3650" value="30" required></label>
          <label class="adm-field"><span data-t="recipientPhone"></span><input id="planPhone" value="+992 907972295" required maxlength="32"></label>
          <div class="adm-row" style="align-self:end"><button type="submit" class="btn" data-t="save"></button></div>
        </form>

        <h3 class="adm-subhead" data-t="roleTariffsTitle"></h3>
        <div class="adm-filters">
          <label class="adm-field">
            <span data-t="tariffGroupFilter"></span>
            <select id="tariffGroupFilter">
              <option value="all" data-t="groupAll"></option>
              <option value="school" data-t="groupSchool"></option>
              <option value="office" data-t="groupOffice"></option>
              <option value="raesat" data-t="groupRaesat"></option>
            </select>
          </label>
          <label class="adm-field">
            <span data-t="tariffSearch"></span>
            <input id="tariffSearch" type="search" maxlength="80">
          </label>
        </div>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colPosition"></th>
                <th data-t="colBasePrice"></th>
                <th data-t="colExtraPrice"></th>
                <th data-t="colDays"></th>
                <th data-t="colDevices"></th>
                <th data-t="colCanLogin"></th>
                <th data-t="colActive"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="roleTariffsTbody"></tbody>
          </table>
        </div>
      </section>

      <!-- 5. ПЛАТЕЖИ И ЧЕКИ -->
      <section class="adm-card" data-pane="payments" hidden>
        <h2 data-t="tabPayments"></h2>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th data-t="colName"></th>
                <th data-t="colReceipt"></th>
                <th data-t="colActions"></th>
              </tr>
            </thead>
            <tbody id="paymentsTbody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="./admin.mjs"></script>
</body>
</html>
